<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Square icon with ~12% outer margin, high contrast on light and dark backgrounds -->
  <g fill="none" stroke="#0EA5E9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top pins -->
    <line x1="42" y1="16" x2="42" y2="30" />
    <line x1="64" y1="16" x2="64" y2="30" />
    <line x1="86" y1="16" x2="86" y2="30" />
    <!-- Bottom pins -->
    <line x1="42" y1="98" x2="42" y2="112" />
    <line x1="64" y1="98" x2="64" y2="112" />
    <line x1="86" y1="98" x2="86" y2="112" />
    <!-- Left pins -->
    <line x1="16" y1="42" x2="30" y2="42" />
    <line x1="16" y1="64" x2="30" y2="64" />
    <line x1="16" y1="86" x2="30" y2="86" />
    <!-- Right pins -->
    <line x1="98" y1="42" x2="112" y2="42" />
    <line x1="98" y1="64" x2="112" y2="64" />
    <line x1="98" y1="86" x2="112" y2="86" />
  </g>
  <!-- Chip package -->
  <rect x="30" y="30" width="68" height="68" rx="10" fill="#0F172A" stroke="#0EA5E9" stroke-width="5" />
  <!-- Inner die + pulse trace -->
  <rect x="44" y="44" width="40" height="40" rx="5" fill="#1E293B" stroke="#38BDF8" stroke-width="2.5" />
  <polyline points="48,66 56,66 60,54 68,74 72,62 80,62" fill="none" stroke="#22C55E" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Pin 1 orientation dot -->
  <circle cx="40" cy="40" r="3" fill="#F59E0B" />
</svg>
